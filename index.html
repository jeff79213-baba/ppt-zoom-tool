<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>簡報縮放導覽工具</title>
<link rel="stylesheet" href="css/style.css?v=20260818i">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23272e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<div id="viewer">
  <canvas id="pdf-layer"></canvas>
  <canvas id="mark-layer"></canvas>
</div>

<div id="dropzone">
  <div class="dz-inner">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/>
      <path d="M12 18v-6"/>
      <path d="M9 15l3 3 3-3"/>
    </svg>
    <p>將 PDF 拖曳到這裡</p>
    <button id="btn-open" type="button">選擇檔案</button>
    <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
  </div>
</div>

<aside id="tb-wrap">
  <div id="pen-panel" hidden>
    <div class="pen-main">
      <div class="shapes">
        <button class="shapebtn active" data-shape="free" title="隨意線">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-8 6-8 8-4s4 3 5-1 4-6 5-8"/></svg>
        </button>
        <button class="shapebtn" data-shape="line" title="直線">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20L20 4"/></svg>
        </button>
        <button class="shapebtn" data-shape="rect" title="方框">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
        <button class="shapebtn" data-shape="circle" title="圓圈">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/></svg>
        </button>
      </div>
      <button id="pen-color" type="button" class="pen-color" title="更換顏色"></button>
      <div class="pen-width-ctl">
        <span id="pen-width-dot" class="pen-width-dot" title="筆跡粗度預覽"></span>
        <input id="pen-width" class="pen-width" type="range" min="1" max="30" value="4" title="筆跡粗度">
      </div>
    </div>
    <div class="pen-colors" hidden>
      <div class="swatches">
        <button class="sw" data-color="#e53935" style="background:#e53935" title="紅"></button>
        <button class="sw" data-color="#fb8c00" style="background:#fb8c00" title="橘"></button>
        <button class="sw" data-color="#fdd835" style="background:#fdd835" title="黃"></button>
        <button class="sw" data-color="#43a047" style="background:#43a047" title="綠"></button>
        <button class="sw" data-color="#1e88e5" style="background:#1e88e5" title="藍"></button>
        <button class="sw" data-color="#8e24aa" style="background:#8e24aa" title="紫"></button>
        <button class="sw" data-color="#212121" style="background:#212121" title="黑"></button>
        <button class="sw sw-white" data-color="#ffffff" style="background:#ffffff" title="白"></button>
      </div>
    </div>
  </div>

  <nav id="toolbar">
    <button id="tb-drag" type="button" class="tb-drag" title="按住拖動工具列">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="tb-group">
      <button id="tb-add" type="button" class="toolbtn" title="新增 PDF">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 11v6M9 14h6"/></svg>
      </button>
      <span id="pg-file" class="file-btn">尚未開啟</span>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="pg-prev" type="button" class="toolbtn" title="上一頁（↑）">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span id="pg-label">1 / 1</span>
      <button id="pg-next" type="button" class="toolbtn" title="下一頁（↓）">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="tb-glove" type="button" class="toolbtn active" title="手套（平移）  快捷鍵 1">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M6 14v-1a2 2 0 0 0-4 0v3c0 5 3 6 7 6h3c3 0 4-1 5-3l1-3c.5-1.5-1-2.5-2.5-2.5H14"/></svg>
      </button>
      <button id="tb-zoom" type="button" class="toolbtn" title="虛線框（縮放）  快捷鍵 2">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6M11 8v6"/></svg>
      </button>
      <button id="tb-mag" type="button" class="toolbtn" title="放大鏡  快捷鍵 4">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="M21 21l-4.8-4.8"/></svg>
      </button>
      <button id="tb-pen" type="button" class="toolbtn" title="筆（手繪）  快捷鍵 3">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group tb-zoomstep">
      <button id="tb-zoomout" type="button" class="toolbtn" title="縮小">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 12h8"/></svg>
      </button>
      <button id="tb-zoomin" type="button" class="toolbtn" title="放大">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v8M8 12h8"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group pen-options">
      <div class="shapes">
        <button class="shapebtn active" data-shape="free" title="隨意線">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-8 6-8 8-4s4 3 5-1 4-6 5-8"/></svg>
        </button>
        <button class="shapebtn" data-shape="line" title="直線">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20L20 4"/></svg>
        </button>
        <button class="shapebtn" data-shape="rect" title="方框">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
        <button class="shapebtn" data-shape="circle" title="圓圈">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/></svg>
        </button>
      </div>
      <div class="swatches">
        <button class="sw" data-color="#e53935" style="background:#e53935" title="紅"></button>
        <button class="sw" data-color="#fb8c00" style="background:#fb8c00" title="橘"></button>
        <button class="sw" data-color="#fdd835" style="background:#fdd835" title="黃"></button>
        <button class="sw" data-color="#43a047" style="background:#43a047" title="綠"></button>
        <button class="sw" data-color="#1e88e5" style="background:#1e88e5" title="藍"></button>
        <button class="sw" data-color="#8e24aa" style="background:#8e24aa" title="紫"></button>
        <button class="sw" data-color="#212121" style="background:#212121" title="黑"></button>
        <button class="sw sw-white" data-color="#ffffff" style="background:#ffffff" title="白"></button>
      </div>
      <div class="width-row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="2"/></svg>
        <input class="pen-width" type="range" min="1" max="30" value="4">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7"/></svg>
      </div>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="tb-undo" type="button" class="toolbtn" title="復原最後一筆">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
      </button>
      <button id="tb-clear" type="button" class="toolbtn" title="清空全部筆跡與放大鏡">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg>
      </button>
      <button id="tb-reset" type="button" class="toolbtn" title="回到整頁  快捷鍵 R">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 19h16M9 5v14M15 5v14"/></svg>
      </button>
      <button id="tb-fullscreen" type="button" class="toolbtn" title="全螢幕  快捷鍵 F">
        <svg id="fs-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>

    <div class="tb-sep"></div>

    <label class="tb-opacity" title="工具列透明度">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>
      <input id="tb-opacity" type="range" min="0" max="100" value="100">
    </label>
    <button id="tb-pin" type="button" class="tb-pin" title="鎖定/解鎖工具列位置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v4l-4 6v2h12v-2l-4-6V3M8 19v2M12 15v6"/></svg>
    </button>
    <button id="tb-collapse" type="button" class="toolbtn" title="收起工具列">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h18M12 9v7"/></svg>
    </button>
  </nav>
  <div id="tb-mini">
    <button id="tb-expand-prev" type="button" class="tb-mini-btn" title="上一頁">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="tb-expand" type="button" class="tb-mini-btn" title="展開工具列">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button id="tb-expand-next" type="button" class="tb-mini-btn" title="下一頁">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</aside>

<div id="pwa-hint" hidden>
  <span>加入主畫面可全螢幕觀看</span>
  <button id="pwa-hint-close" type="button">✕</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<script src="js/app.js?v=20260818i"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=20260818i').catch(() => {});
}
</script>
</body>
</html>
